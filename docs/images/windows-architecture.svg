<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 798" width="1040" height="798" role="img" aria-labelledby="t d">
<title id="t">MinerGuru Windows: Aufbau</title>
<desc id="d">Eine exe mit drei Rollen: normaler Start der WinUI-App, Widget-Dienst mit dem Argument -widgetprovider und Weiterreichen bei Start mit Paketidentität. Darunter das WinUI-Projekt MinerGuru, das Projekt MinerGuru.Core ohne WinUI mit Store, Diensten und Modellen, die xUnit-Tests und der Datenordner.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Helvetica,Arial,sans-serif;fill:#1d1d1f}
.h{font-size:19px;font-weight:650}.b{font-size:14px;font-weight:600}.t{font-size:13px;font-weight:600}.m{font-size:12.5px;fill:#6e6e73}
.c,.c text{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:11.5px;fill:#3a3a3c}
.z{font-size:12.5px;font-weight:600;fill:#8a8a8e}
.bg{fill:#fafafa;stroke:#e4e4e7}.card{fill:#fff;stroke:#d4d4d9}.raised{fill:#f1f1f3;stroke:#d9d9de}.pill{fill:#fff}
.hot{fill:#fdf3e6;stroke:#e0923a}
.ln{fill:none;stroke:#8e8e93;stroke-width:1.5}.la{fill:none;stroke:#d9780a;stroke-width:1.8}.dash{stroke-dasharray:5 4}
.ah{fill:#8e8e93}.aa{fill:#d9780a}
@media (prefers-color-scheme:dark){
text{fill:#f2f2f3}.m{fill:#a1a1a6}.c,.c text{fill:#d1d1d6}.z{fill:#8e8e93}
.bg{fill:#141415;stroke:#2c2c2f}.card{fill:#1c1c1e;stroke:#3a3a3e}.raised{fill:#242426;stroke:#38383c}.pill{fill:#1c1c1e}
.hot{fill:#2d2114;stroke:#b8762c}
.ln{stroke:#7c7c82}.ah{fill:#7c7c82}.la{stroke:#f0a03c}.aa{fill:#f0a03c}}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="ah" d="M0,1 L10,5 L0,9 z"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="aa" d="M0,1 L10,5 L0,9 z"/></marker>
</defs>
<rect class="bg" x="0.5" y="0.5" width="1039" height="797" rx="16"/>
<text class="h" x="32" y="46">Windows-App: Aufbau</text>
<text class="m" x="32" y="70">Eine exe mit drei Rollen und zwei Projekte: die Oberfläche in MinerGuru, alles Testbare in MinerGuru.Core.</text>

<!-- Entry: Program.Main -->
<rect class="card" x="24" y="100" width="992" height="134" rx="12"/>
<text class="z" x="40" y="121">MinerGuru.exe · Program.Main entscheidet beim Start</text>
<path class="ln dash" d="M845 146V134H195V144" marker-end="url(#ah)"/>
<rect class="pill" x="418" y="125" width="204" height="18" rx="9"/>
<text class="m" x="520" y="138" text-anchor="middle">über explorer.exe, ohne Paket</text>

<rect class="raised" x="40" y="146" width="310" height="72" rx="9"/>
<text class="t" x="56" y="168">Normaler Start</text>
<text class="m" x="56" y="189">Einzelinstanz: Ein zweiter Start holt</text>
<text class="m" x="56" y="207">das laufende Fenster nach vorn.</text>
<rect class="hot" x="365" y="146" width="310" height="72" rx="9"/>
<text class="t" x="381" y="168">Mit <tspan class="c">-widgetprovider</tspan></text>
<text class="m" x="381" y="189">Windows startet den Widget-Dienst:</text>
<text class="m" x="381" y="207">liest snapshot.json, fragt sonst selbst</text>
<rect class="raised" x="690" y="146" width="310" height="72" rx="9"/>
<text class="t" x="706" y="168">Mit Paketidentität</text>
<text class="m" x="706" y="189">Tipp aufs Widget (minerguru://open)</text>
<text class="m" x="706" y="207">reicht nur an die normale App weiter.</text>

<path class="ln" d="M132 218V288" marker-end="url(#ah)"/>
<path class="la" d="M520 218V288" marker-end="url(#aa)"/>

